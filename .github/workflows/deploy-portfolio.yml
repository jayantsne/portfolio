name: Deploy Portfolio to Firebase

on:
  push:
    branches:
      - main
    paths:
      - 'angular-starter/**'
      - '.github/workflows/deploy-portfolio.yml'
  workflow_dispatch:  # Allow manual triggers

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: angular-starter/package-lock.json
      
      - name: 📦 Install dependencies
        working-directory: ./angular-starter
        run: npm ci
      
      - name: 🏗️ Build Angular app
        working-directory: ./angular-starter
        run: npm run build

      - name: 🔍 Check Firebase token
        id: check_firebase
        run: |
          if [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "⚠️  FIREBASE_TOKEN secret is not set. Skipping Firebase deployment."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 🚀 Deploy to Firebase Hosting
        if: steps.check_firebase.outputs.skip == 'false'
        working-directory: ./angular-starter
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:myportfolioadmin-d45bd --token "${{ secrets.FIREBASE_TOKEN }}" --project myportfolioadmin --non-interactive
      
      - name: 📊 Deployment Summary
        if: success()
        run: |
          echo "### 🎉 Portfolio Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** Firebase Hosting" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** myportfolioadmin" >> $GITHUB_STEP_SUMMARY
          echo "**Site:** https://myportfolioadmin-d45bd.web.app" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Visit your site to verify the deployment." >> $GITHUB_STEP_SUMMARY
