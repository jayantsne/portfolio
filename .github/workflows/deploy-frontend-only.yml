name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Frontend to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: angular-starter/package-lock.json
      
      - name: 📦 Install dependencies
        working-directory: ./angular-starter
        run: npm ci
      
      - name: 🏗️ Build Angular app
        working-directory: ./angular-starter
        run: npm run build -- --configuration production
      
      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: 🚀 Deploy to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./angular-starter/dist/angular-starter/ \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/var/www/learnwithai.tech/frontend/
          
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
            "sudo systemctl reload nginx"
      
      - name: 🧹 Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
      
      - name: 📊 Summary
        run: |
          echo "### 🎉 Frontend Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "**Site:** http://76.13.244.113" >> $GITHUB_STEP_SUMMARY
