name: Deploy AI Learn App to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'angular-starter/**'
      - '.github/workflows/deploy-frontend-only.yml'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy Frontend to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔍 Check required secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then
            echo "⚠️  VPS_SSH_PRIVATE_KEY secret is not set. Skipping VPS deployment."
            echo "👉 Add it at: Settings → Secrets and variables → Actions → New repository secret"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "✅ VPS_SSH_PRIVATE_KEY secret found."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 📥 Checkout code
        if: steps.check_secrets.outputs.skip == 'false'
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        if: steps.check_secrets.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: angular-starter/package-lock.json
      
      - name: 📦 Install dependencies
        if: steps.check_secrets.outputs.skip == 'false'
        working-directory: ./angular-starter
        run: npm install
      
      - name: 🏗️ Build Angular app
        if: steps.check_secrets.outputs.skip == 'false'
        working-directory: ./angular-starter
        run: |
          npm run build
          echo "✓ Build completed successfully"
          ls -lh dist/angular-starter/
      
      - name: 📦 Create deployment archive
        if: steps.check_secrets.outputs.skip == 'false'
        working-directory: ./angular-starter/dist
        run: |
          tar -czf ../../frontend-deploy.tar.gz angular-starter/
          cd ../..  
          echo "Archive size: $(du -h frontend-deploy.tar.gz | cut -f1)"
      
      - name: 🔑 Setup SSH
        if: steps.check_secrets.outputs.skip == 'false'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H 76.13.244.113 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 📤 Upload to VPS
        if: steps.check_secrets.outputs.skip == 'false'
        run: |
          scp -i ~/.ssh/deploy_key \
            frontend-deploy.tar.gz \
            root@76.13.244.113:/tmp/frontend-deploy.tar.gz
          echo "✓ Archive uploaded to VPS"
      
      - name: 🚀 Deploy on VPS
        if: steps.check_secrets.outputs.skip == 'false'
        run: |
          ssh -i ~/.ssh/deploy_key root@76.13.244.113 << 'ENDSSH'
            set -e
            echo "🗑️  Cleaning old files..."
            rm -rf /var/www/learnwithai.tech/frontend/*
            
            echo "📦 Extracting new files..."
            cd /var/www/learnwithai.tech/frontend/
            tar -xzf /tmp/frontend-deploy.tar.gz --strip-components=1
            rm /tmp/frontend-deploy.tar.gz
            
            echo "🔧 Setting permissions..."
            chmod -R 755 /var/www/learnwithai.tech/frontend/
            chown -R www-data:www-data /var/www/learnwithai.tech/frontend/
            
            echo "🔄 Reloading nginx..."
            nginx -t && systemctl reload nginx
            
            echo "✅ Deployment complete!"
            echo "📊 Files deployed:"
            ls -lh /var/www/learnwithai.tech/frontend/ | head -10
            
            if [ -f /var/www/learnwithai.tech/frontend/index.html ]; then
              echo "✓ index.html verified"
            else
              echo "❌ ERROR: index.html missing!"
              exit 1
            fi
          ENDSSH
      
      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f frontend-deploy.tar.gz

      - name: ⏭️  Skipped Summary
        if: steps.check_secrets.outputs.skip == 'true'
        run: |
          echo "### ⏭️ VPS Deployment Skipped" >> $GITHUB_STEP_SUMMARY
          echo "Secret VPS_SSH_PRIVATE_KEY is not configured." >> $GITHUB_STEP_SUMMARY
          echo "Add it in: **Settings → Secrets and variables → Actions**" >> $GITHUB_STEP_SUMMARY
      
      - name: 📊 Deployment Summary
        if: success() && steps.check_secrets.outputs.skip == 'false'
        run: |
          echo "### 🎉 AI Learn App Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🌐 Live URL:** http://76.13.244.113" >> $GITHUB_STEP_SUMMARY
          echo "**🌐 Domain:** http://learnwithai.tech" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**📦 Deployed:** \`$(date)\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All checks passed. Your app is live!" >> $GITHUB_STEP_SUMMARY
      
      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "Common issues:" >> $GITHUB_STEP_SUMMARY
          echo "- SSH key not configured in GitHub Secrets" >> $GITHUB_STEP_SUMMARY
          echo "- VPS not accessible" >> $GITHUB_STEP_SUMMARY
          echo "- Build errors" >> $GITHUB_STEP_SUMMARY
