name: Deploy .NET API to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'enterprise-dotnet-api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy .NET API
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Check required secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then
            echo "⚠️  VPS_SSH_PRIVATE_KEY not set. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Secret found."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: � Check VPS SSH connectivity
        id: check_vps
        if: steps.check_secrets.outputs.skip == 'false'
        run: |
          echo "Testing TCP connectivity to 76.13.244.113:22 (10s timeout)..."
          if nc -z -w 10 76.13.244.113 22; then
            echo "✅ VPS port 22 is reachable"
            echo "reachable=true" >> $GITHUB_OUTPUT
          else
            echo "❌ VPS port 22 is NOT reachable (firewall or server down)"
            echo "reachable=false" >> $GITHUB_OUTPUT
          fi

      - name: ⏭️ Skip — VPS unreachable
        if: steps.check_secrets.outputs.skip == 'false' && steps.check_vps.outputs.reachable == 'false'
        run: |
          echo "::warning::VPS 76.13.244.113:22 is unreachable. Deployment skipped."
          echo "Fix: ensure port 22 is open in the VPS firewall (ufw allow 22 / iptables -A INPUT -p tcp --dport 22 -j ACCEPT)"
          exit 1

      - name: 📥 Checkout code
        if: steps.check_secrets.outputs.skip == 'false' && steps.check_vps.outputs.reachable == 'true'
        uses: actions/checkout@v4

      - name: 🟣 Setup .NET 8
        if: steps.check_secrets.outputs.skip == 'false' && steps.check_vps.outputs.reachable == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Restore dependencies
        if: steps.check_secrets.outputs.skip == 'false' && steps.check_vps.outputs.reachable == 'true'
        working-directory: ./enterprise-dotnet-api
        run: dotnet restore src/AILearnAPI.Api/AILearnAPI.Api.csproj

      - name: 🏗️ Publish API (linux-x64)
        if: steps.check_secrets.outputs.skip == 'false' && steps.check_vps.outputs.reachable == 'true'
        working-directory: ./enterprise-dotnet-api
        run: |
          dotnet publish src/AILearnAPI.Api/AILearnAPI.Api.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            --output ./publish
          echo "✓ Build complete"
          ls -lh publish/

      - name: 📦 Create deployment archive
        if: steps.check_secrets.outputs.skip == 'false' && steps.check_vps.outputs.reachable == 'true'
        run: |
          tar -czf api-deploy.tar.gz -C enterprise-dotnet-api/publish .
          echo "Archive: $(du -h api-deploy.tar.gz | cut -f1)"

      - name: 📤 Upload API archive to VPS
        if: steps.check_secrets.outputs.skip == 'false' && steps.check_vps.outputs.reachable == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 76.13.244.113
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: api-deploy.tar.gz
          target: /tmp/
          timeout: 30s
          command_timeout: 5m

      - name: 📤 Upload systemd service to VPS
        if: steps.check_secrets.outputs.skip == 'false' && steps.check_vps.outputs.reachable == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 76.13.244.113
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: server-configs/systemd/ailearnapi.service
          target: /tmp/
          strip_components: 2
          timeout: 30s
          command_timeout: 5m

      - name: 🚀 Deploy & Start API on VPS
        if: steps.check_secrets.outputs.skip == 'false' && steps.check_vps.outputs.reachable == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 76.13.244.113
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          connect_timeout: 30s
          command_timeout: 10m
          script: |
            set -e

            # ── Install .NET 8 runtime if missing ──
            if ! command -v dotnet &>/dev/null || ! dotnet --list-runtimes | grep -q "Microsoft.AspNetCore.App 8"; then
              echo "📥 Installing .NET 8 runtime..."
              wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -O /tmp/ms-prod.deb
              dpkg -i /tmp/ms-prod.deb
              apt-get update -qq
              apt-get install -y aspnetcore-runtime-8.0
              rm /tmp/ms-prod.deb
              echo "✅ .NET 8 runtime installed: $(dotnet --version)"
            else
              echo "✅ .NET runtime already present: $(dotnet --list-runtimes | grep 'AspNetCore.App 8')"
            fi

            # ── Create backend directory ──
            mkdir -p /var/www/learnwithai.tech/backend

            # ── Stop service and ensure port 5000 is free ──
            systemctl stop ailearnapi 2>/dev/null || true
            sleep 2
            # Kill by port only (pkill -f would self-kill the script)
            fuser -k 5000/tcp 2>/dev/null || true
            sleep 1
            ss -tlnp | grep 5000 && (echo "❌ Port 5000 still occupied!"; exit 1) || echo "✅ Port 5000 free"
            echo "⏸️  Service stopped, port 5000 cleared"

            # ── Deploy API files ──
            rm -rf /var/www/learnwithai.tech/backend/*
            ARCHIVE=$(find /tmp -name "api-deploy.tar.gz" 2>/dev/null | head -1)
            if [ -z "$ARCHIVE" ]; then echo "❌ Archive not found in /tmp!"; find /tmp -type f | head -20; exit 1; fi
            echo "📦 Found archive: $ARCHIVE"
            tar -xzf "$ARCHIVE" -C /var/www/learnwithai.tech/backend/
            rm "$ARCHIVE"
            chmod -R 755 /var/www/learnwithai.tech/backend/
            echo "📦 API files deployed"

            # ── Install/update systemd service ──
            # Use root user since we deploy as root
            SERVICE=$(find /tmp -name "ailearnapi.service" 2>/dev/null | head -1)
            if [ -z "$SERVICE" ]; then echo "❌ Service file not found!"; exit 1; fi
            DOTNET_PATH=$(command -v dotnet)
            echo "🔍 dotnet path: $DOTNET_PATH"
            sed \
              -e 's/User=deployuser/User=root/g' \
              -e 's/Group=deployuser/Group=root/g' \
              -e 's|Type=notify|Type=simple|g' \
              -e '/Wants=mongod.service/d' \
              -e '/After=network.target mongod.service/c\After=network.target' \
              -e "s|ExecStart=/usr/bin/dotnet|ExecStart=$DOTNET_PATH|g" \
              "$SERVICE" > /etc/systemd/system/ailearnapi.service
            rm "$SERVICE"
            echo "📄 Installed service file:"
            cat /etc/systemd/system/ailearnapi.service
            systemctl daemon-reload
            systemctl enable ailearnapi
            echo "⚙️  Systemd service installed"

            # ── Start API service ──
            systemctl start ailearnapi || true
            sleep 5
            echo "📋 Service status:"
            systemctl status ailearnapi --no-pager || true
            echo "📋 Journal logs:"
            journalctl -u ailearnapi -n 30 --no-pager || true
            systemctl is-active --quiet ailearnapi && echo "✅ ailearnapi service is running" || (echo "❌ Service failed to start — see logs above"; exit 1)

            # ── Reload nginx (only if config test passes) ──
            if nginx -t 2>/dev/null; then
              systemctl reload nginx
              echo "🔄 Nginx reloaded"
            else
              echo "⚠️  Nginx config test failed — skipping reload (API still running on port 5000)"
              nginx -t 2>&1 || true
            fi

            echo "✅ API deployed at https://learnwithai.tech/api"

      - name: ⏭️ Skipped
        if: steps.check_secrets.outputs.skip == 'true'
        run: echo "Skipped — VPS_SSH_PRIVATE_KEY not set"

      - name: 📊 Summary
        if: success() && steps.check_secrets.outputs.skip == 'false'
        run: |
          echo "### 🎉 .NET API Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** https://learnwithai.tech/api" >> $GITHUB_STEP_SUMMARY
          echo "**Health:** https://learnwithai.tech/api/health" >> $GITHUB_STEP_SUMMARY
          echo "**Swagger:** https://learnwithai.tech/swagger" >> $GITHUB_STEP_SUMMARY
