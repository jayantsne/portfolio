name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "enterprise-dotnet-api/**"
      - "server-configs/systemd/ailearnapi.service"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH || '/var/www/learnwithai.tech/backend' }}
  API_SERVICE_NAME: ${{ vars.API_SERVICE_NAME || 'ailearnapi' }}

jobs:
  deploy:
    name: Build and deploy .NET API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-dotnet-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          test -n "${{ secrets.VPS_HOST }}" || (echo "Missing secret VPS_HOST" && exit 1)
          test -n "${{ secrets.VPS_USER }}" || (echo "Missing secret VPS_USER" && exit 1)
          test -n "${{ secrets.VPS_SSH_PRIVATE_KEY }}" || (echo "Missing secret VPS_SSH_PRIVATE_KEY" && exit 1)
          test -n "${{ secrets.MONGODB_CONNECTION_STRING }}" || (echo "Missing secret MONGODB_CONNECTION_STRING" && exit 1)
          test -n "${{ secrets.API_KEY }}" || (echo "Missing secret API_KEY" && exit 1)
          test -n "${{ secrets.JWT_SECRET_KEY }}" || (echo "Missing secret JWT_SECRET_KEY" && exit 1)

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AILearnAPI.sln

      - name: Publish
        run: |
          rm -rf publish
          dotnet publish src/AILearnAPI.Api/AILearnAPI.Api.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            --output publish

      - name: Archive API
        run: tar -czf ../api-deploy.tar.gz -C publish .

      - name: Upload API archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: api-deploy.tar.gz
          target: /tmp

      - name: Upload service file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: server-configs/systemd/ailearnapi.service
          target: /tmp

      - name: Activate API release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            SERVICE_NAME="${{ env.API_SERVICE_NAME }}"
            DEPLOY_PATH="${{ env.BACKEND_DEPLOY_PATH }}"
            RELEASE="/tmp/api-release-${{ github.sha }}"
            ENV_FILE="/etc/ailearnapi.env"

            sudo mkdir -p "$DEPLOY_PATH" "$RELEASE"
            sudo tar -xzf /tmp/api-deploy.tar.gz -C "$RELEASE"
            rm -f /tmp/api-deploy.tar.gz

            sudo install -m 0644 /tmp/server-configs/systemd/ailearnapi.service /etc/systemd/system/"$SERVICE_NAME".service
            sudo rm -rf /tmp/server-configs

            sudo touch "$ENV_FILE"
            EXISTING_LLM_PROVIDER_ENCRYPTION_KEY="$(sudo grep -E '^LlmProvider__EncryptionKey=' "$ENV_FILE" 2>/dev/null | tail -n 1 | cut -d= -f2- || true)"
            EXISTING_DEFAULT_ADMIN_PASSWORD="$(sudo grep -E '^DefaultAdmin__Password=' "$ENV_FILE" 2>/dev/null | tail -n 1 | cut -d= -f2- || true)"
            LLM_PROVIDER_ENCRYPTION_KEY_VALUE="${{ secrets.LLM_PROVIDER_ENCRYPTION_KEY }}"
            DEFAULT_ADMIN_PASSWORD_VALUE="${{ secrets.DEFAULT_ADMIN_PASSWORD }}"
            if [ -z "$LLM_PROVIDER_ENCRYPTION_KEY_VALUE" ]; then
              LLM_PROVIDER_ENCRYPTION_KEY_VALUE="$EXISTING_LLM_PROVIDER_ENCRYPTION_KEY"
            fi
            if [ -z "$DEFAULT_ADMIN_PASSWORD_VALUE" ]; then
              DEFAULT_ADMIN_PASSWORD_VALUE="$EXISTING_DEFAULT_ADMIN_PASSWORD"
            fi
            if [ -z "$LLM_PROVIDER_ENCRYPTION_KEY_VALUE" ]; then
              LLM_PROVIDER_ENCRYPTION_KEY_VALUE="$(openssl rand -base64 32)"
              echo "Generated LlmProvider__EncryptionKey because no existing server value or GitHub secret was found."
            fi
            DEFAULT_ADMIN_PASSWORD_LINE=""
            if [ -n "$DEFAULT_ADMIN_PASSWORD_VALUE" ]; then
              DEFAULT_ADMIN_PASSWORD_LINE="DefaultAdmin__Password=$DEFAULT_ADMIN_PASSWORD_VALUE"
            fi

            sudo tee "$ENV_FILE" >/dev/null <<EOF
            ASPNETCORE_ENVIRONMENT=Production
            ASPNETCORE_URLS=http://localhost:5000
            DOTNET_PRINT_TELEMETRY_MESSAGE=false
            ConnectionStrings__MongoDB=${{ secrets.MONGODB_CONNECTION_STRING }}
            ConnectionStrings__Redis=${{ secrets.REDIS_CONNECTION_STRING || 'localhost:6379' }}
            MongoDB__DatabaseName=${{ secrets.MONGODB_DATABASE || 'jayant-portfolio' }}
            MongoDB__RequireTls=${{ vars.MONGODB_REQUIRE_TLS || 'true' }}
            MongoDB__AllowInvalidCertificates=${{ vars.MONGODB_ALLOW_INVALID_CERTIFICATES || 'false' }}
            MongoDB__AllowInvalidHostnames=${{ vars.MONGODB_ALLOW_INVALID_HOSTNAMES || 'false' }}
            ApiSettings__ApiKey=${{ secrets.API_KEY }}
            JwtSettings__SecretKey=${{ secrets.JWT_SECRET_KEY }}
            JwtSettings__Issuer=${{ vars.JWT_ISSUER || 'AILearnAPI' }}
            JwtSettings__Audience=${{ vars.JWT_AUDIENCE || 'AILearnAPI' }}
            LlmProvider__EncryptionKey=$LLM_PROVIDER_ENCRYPTION_KEY_VALUE
            $DEFAULT_ADMIN_PASSWORD_LINE
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY || '' }}
            Razorpay__KeyId=${{ secrets.RAZORPAY_KEY_ID || '' }}
            Razorpay__KeySecret=${{ secrets.RAZORPAY_KEY_SECRET || '' }}
            EOF
            sudo chmod 600 "$ENV_FILE"
            sudo chown root:root "$ENV_FILE"

            sudo systemctl stop "$SERVICE_NAME" 2>/dev/null || true
            sudo rsync -a --delete "$RELEASE"/ "$DEPLOY_PATH"/
            sudo rm -rf "$RELEASE"
            sudo chown -R root:root "$DEPLOY_PATH"
            sudo find "$DEPLOY_PATH" -type d -exec chmod 755 {} \;
            sudo find "$DEPLOY_PATH" -type f -exec chmod 644 {} \;

            sudo systemctl daemon-reload
            sudo systemctl enable "$SERVICE_NAME"
            sudo systemctl restart "$SERVICE_NAME"

            sudo nginx -t
            sudo systemctl reload nginx

            for attempt in $(seq 1 30); do
              if sudo systemctl is-active --quiet "$SERVICE_NAME" && \
                 (curl -fsS http://127.0.0.1:5000/health || curl -fsS http://127.0.0.1:5000/api/health); then
                echo "API health check passed on attempt $attempt"
                echo "API deployed to $DEPLOY_PATH"
                exit 0
              fi
              sleep 2
            done

            sudo systemctl --no-pager --full status "$SERVICE_NAME" || true
            sudo journalctl -u "$SERVICE_NAME" -n 80 --no-pager || true
            exit 1
