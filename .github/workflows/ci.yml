name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-starter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: angular-starter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  api:
    name: API build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-dotnet-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AILearnAPI.sln

      - name: Build
        run: dotnet build AILearnAPI.sln --configuration Release --no-restore
