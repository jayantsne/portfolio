<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT-style Layout</title>

  <!--
  CORRECT DOM TREE (navbar scoped to right only):

  .shell  (flex row)
    +-- .sidebar   (260px, flex-shrink:0)
    +-- .right     (flex:1, flex-column)
          +-- .navbar      (52px, flex-shrink:0)  ? NOT full-width
          +-- .content     (flex:1, overflow-y)
                +-- .landing   (flex:1, centers hero/chips)
                +-- .input-dock (always stuck to bottom)
  -->

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #0d0d0d;
      -webkit-font-smoothing: antialiased;
    }
    button   { font-family: inherit; cursor: pointer; }
    textarea { font-family: inherit; }

    /* -- SHELL ----------------------------------- */
    .shell {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* -- SIDEBAR --------------------------------- */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      height: 100vh;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.25s ease;
    }

    .sidebar-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      padding: 0 10px;
      flex-shrink: 0;
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 8px;
      scrollbar-width: thin;
      scrollbar-color: #d0d0d0 transparent;
    }
    .sidebar-body::-webkit-scrollbar { width: 4px; }
    .sidebar-body::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 4px; }

    .s-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: #999;
      padding: 10px 8px 3px;
    }

    .s-item {
      display: block;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.84rem;
      color: #333;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.12s;
    }
    .s-item:hover  { background: rgba(0,0,0,0.05); }
    .s-item.active { background: rgba(0,0,0,0.07); color: #0d0d0d; font-weight: 500; }

    .sidebar-ft {
      flex-shrink: 0;
      border-top: 1px solid rgba(0,0,0,0.07);
      padding: 8px;
    }
    .user-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 10px;
      padding: 8px 10px;
      transition: background 0.12s;
    }
    .user-btn:hover { background: rgba(0,0,0,0.05); }
    .user-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .user-name { font-size: 0.84rem; font-weight: 600; color: #0d0d0d; }

    /* -- RIGHT SECTION --------------------------- */
    .right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }

    /* -- NAVBAR (child of .right, never full width) */
    .navbar {
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 6px;
      background: #fff;
    }
    .navbar-left  { display: flex; align-items: center; gap: 4px; flex: 1; }
    .navbar-right { display: flex; align-items: center; gap: 2px; }

    .model-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: none;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.9375rem;
      font-weight: 700;
      color: #0d0d0d;
      transition: background 0.12s;
    }
    .model-btn:hover { background: rgba(0,0,0,0.05); }
    .model-caret { color: #999; }

    /* -- ICON BUTTON (shared) --------------------- */
    .icon-btn {
      width: 36px; height: 36px;
      border: none; background: transparent;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #555;
      flex-shrink: 0;
      transition: background 0.12s, color 0.12s;
    }
    .icon-btn:hover { background: rgba(0,0,0,0.07); color: #0d0d0d; }
    .icon-btn svg { pointer-events: none; }

    /* -- CONTENT (only scroll zone) -------------- */
    .content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      scrollbar-width: thin;
      scrollbar-color: #d0d0d0 transparent;
    }
    .content::-webkit-scrollbar { width: 5px; }
    .content::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 4px; }

    /* landing fills remaining space, pushing input-dock to bottom */
    .landing {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 0 1.5rem 1.5rem;
    }

    .hero-title {
      font-size: 1.9rem;
      font-weight: 700;
      color: #0d0d0d;
      letter-spacing: -0.4px;
      margin-bottom: 1.5rem;
    }

    /* 2×2 suggestion chip grid */
    .chips {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      max-width: 680px;
    }
    .chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 12px;
      padding: 11px 14px;
      text-align: left;
      transition: background 0.12s;
    }
    .chip:hover { background: rgba(0,0,0,0.04); }
    .chip-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: rgba(0,0,0,0.06);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: #555;
    }
    .chip-title { font-weight: 600; font-size: 0.84rem; color: #0d0d0d; display: block; }
    .chip-sub   { font-size: 0.76rem; color: #777; display: block; margin-top: 1px; }

    /* -- INPUT DOCK (always at bottom) ----------- */
    .input-dock {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 16px 20px;
    }

    .input-box {
      width: 100%;
      max-width: 680px;
      background: #f4f4f4;
      border-radius: 18px;
      padding: 12px 12px 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: box-shadow 0.15s;
    }
    .input-box:focus-within {
      box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
    }

    .input-textarea {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.9375rem;
      color: #0d0d0d;
      resize: none;
      min-height: 24px;
      max-height: 200px;
      line-height: 1.5;
    }
    .input-textarea::placeholder { color: #999; }

    .input-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toolbar-left  { display: flex; gap: 2px; }
    .toolbar-right { display: flex; gap: 4px; align-items: center; }

    .ibox-btn {
      width: 32px; height: 32px;
      border: none; background: transparent;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #666;
      transition: background 0.12s;
    }
    .ibox-btn:hover { background: rgba(0,0,0,0.07); color: #0d0d0d; }

    .send-btn {
      width: 32px; height: 32px;
      border: none;
      background: #0d0d0d;
      color: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, transform 0.1s;
    }
    .send-btn:hover { background: #333; transform: scale(1.08); }

    .input-hint {
      font-size: 0.72rem;
      color: #aaa;
      margin-top: 8px;
    }

    /* -- MOBILE =768px ---------------------------- */
    .mobile-only { display: none; }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed; top: 0; left: 0;
        height: 100vh; width: 260px;
        z-index: 300;
        box-shadow: 4px 0 20px rgba(0,0,0,0.12);
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }

      .overlay {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.3); z-index: 299;
      }
      .overlay.visible { display: block; }

      .mobile-only { display: flex; }
      .chips { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <div class="shell">

    <!-- -- SIDEBAR -- -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-hd">
        <button class="icon-btn" onclick="toggleSidebar()" title="Collapse sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2.5"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>
        <button class="icon-btn" title="New chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-body">
        <div class="s-label">Today</div>
        <button class="s-item active">UI/UX Layout Issue</button>
        <button class="s-item">Playground Fix Prompt</button>
        <button class="s-item">Hash-based Routing in Angular</button>

        <div class="s-label">Yesterday</div>
        <button class="s-item">UI UX Fix Prompt</button>
        <button class="s-item">Fix UI Overlap Prompt</button>
        <button class="s-item">Thread in .NET</button>

        <div class="s-label">Previous 7 days</div>
        <button class="s-item">Lazy loading in Angular</button>
        <button class="s-item">Professional CV Feedback App</button>
        <button class="s-item">AI Learning UI Improvement</button>
        <button class="s-item">Practicing Semantic Kernel</button>
      </div>

      <div class="sidebar-ft">
        <button class="user-btn">
          <div class="user-avatar">J</div>
          <span class="user-name">jayant bhardwaj</span>
        </button>
      </div>
    </aside>

    <!-- -- RIGHT SECTION -- -->
    <div class="right">

      <!-- Navbar: width = viewport - 260px automatically -->
      <header class="navbar">
        <div class="navbar-left">
          <button class="icon-btn mobile-only" onclick="toggleSidebar()" title="Open sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2.5"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
          </button>
          <button class="model-btn">
            Codexa AI
            <svg class="model-caret" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
        </div>
        <div class="navbar-right">
          <button class="icon-btn" title="Share">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
          </button>
          <button class="icon-btn" title="More options">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="5" r="1.2" fill="currentColor"/>
              <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
              <circle cx="12" cy="19" r="1.2" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Content: the only scroll container -->
      <main class="content">

        <!-- Landing fills space, pushes input-dock to bottom -->
        <div class="landing">
          <h1 class="hero-title">What can I help with?</h1>

          <div class="chips">
            <button class="chip">
              <div class="chip-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
                </svg>
              </div>
              <div>
                <span class="chip-title">Write code</span>
                <span class="chip-sub">Start a new project or feature</span>
              </div>
            </button>

            <button class="chip">
              <div class="chip-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
              </div>
              <div>
                <span class="chip-title">Review my code</span>
                <span class="chip-sub">Get feedback and suggestions</span>
              </div>
            </button>

            <button class="chip">
              <div class="chip-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
              </div>
              <div>
                <span class="chip-title">Explain a concept</span>
                <span class="chip-sub">Make any topic clear</span>
              </div>
            </button>

            <button class="chip">
              <div class="chip-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                  <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
              </div>
              <div>
                <span class="chip-title">Prep for interview</span>
                <span class="chip-sub">Practice Q&amp;A by topic</span>
              </div>
            </button>
          </div>
        </div>

        <!-- Input dock: flex-shrink:0 keeps it at the bottom -->
        <div class="input-dock">
          <div class="input-box">
            <textarea class="input-textarea" id="chatInput"
              placeholder="Ask anything" rows="1"
              oninput="autoResize(this)"></textarea>
            <div class="input-toolbar">
              <div class="toolbar-left">
                <button class="ibox-btn" title="Attach file">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                  </svg>
                </button>
              </div>
              <div class="toolbar-right">
                <button class="ibox-btn" title="Voice input">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                  </svg>
                </button>
                <button class="send-btn" title="Send message">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"/>
                    <polyline points="5 12 12 5 19 12"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <p class="input-hint">Codexa AI can make mistakes. Check important info.</p>
        </div>

      </main>
    </div>

  </div>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('visible');
    }
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    }
  </script>
</body>
</html>
