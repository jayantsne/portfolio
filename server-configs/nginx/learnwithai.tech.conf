# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Upstream backend (for load balancing if needed in future)
upstream api_backend {
    server localhost:5000 fail_timeout=10s max_fails=3;
    # Add more backend servers for load balancing:
    # server localhost:5001 backup;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name learnwithai.tech www.learnwithai.tech;
    
    # Let's Encrypt ACME challenge for SSL certificate verification
    location /.well-known/acme-challenge/ {
        root /var/www/learnwithai.tech;
        allow all;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name learnwithai.tech www.learnwithai.tech;
    
    # Root directory
    root /var/www/learnwithai.tech/frontend;
    
    # SSL Configuration (automatically managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/learnwithai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learnwithai.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Logging
    access_log /var/log/nginx/learnwithai.tech_access.log;
    error_log /var/log/nginx/learnwithai.tech_error.log warn;
    
    # ===== BACKEND API =====
    location /api {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        # NOTE: CORS headers are intentionally omitted here.
        # ASP.NET Core's CORS middleware (AllowAnyOrigin policy) adds them exclusively.
        # Duplicating them at the nginx level causes browsers to reject the response.
        # OPTIONS preflight is also forwarded to ASP.NET so its CORS middleware responds correctly.
        
        # Proxy to backend
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        
        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Disable buffering for real-time responses
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # NOTE: proxy_intercept_errors is intentionally removed.
        # When enabled it caused nginx to serve its own /50x.html for backend errors,
        # which strips CORS headers from error responses and makes Angular unable to
        # parse any error detail returned by the backend.
    }
    
    # ===== SWAGGER UI (consider removing in production) =====
    location /swagger {
        limit_req zone=api_limit burst=10 nodelay;
        
        proxy_pass http://api_backend/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ===== HEALTH CHECK ENDPOINT =====
    location /api/health {
        access_log off;  # Don't log health checks
        proxy_pass http://api_backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # ===== FRONTEND (Angular SPA) =====
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        
        # Try to serve file, then directory, then fallback to index.html (SPA routing)
        try_files $uri $uri/ /index.html;
        
        # Cache policy for index.html (no cache)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
        
        # Cache static assets aggressively
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        location ~* \.(css|js|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # Gzip Compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/rss+xml
            application/atom+xml
            image/svg+xml
            text/html;
    }
    
    # ===== ERROR PAGES =====
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
    
    # ===== SECURITY: Deny access to hidden files =====
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ===== Block common exploit attempts =====
    location ~ /(wp-admin|wp-login|xmlrpc) {
        deny all;
        access_log off;
        return 444;
    }
}
