<!doctype html>
<html lang="en">
<head>
  <!-- MUST be first: sets the base for all relative URLs -->
  <base href="/">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX', { page_path: window.location.pathname });
  </script>

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Learn with AI</title>

  <!-- A lightweight native-only bridge between Android's system splash and
       Angular's first rendered frame. Angular replaces the app-root contents. -->
  <script>
    if (location.protocol === 'https:' && location.hostname === 'localhost') {
      document.documentElement.classList.add('native-booting');
    }
  </script>
  <style>
    .native-boot-screen { display: none; }
    html.native-booting .native-boot-screen {
      position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center;
      background: #f5f7fb;
    }
    .native-boot-logo {
      display: block; width: 88px; height: 88px; border-radius: 24px;
      box-shadow: 0 20px 45px rgba(19,32,51,.18);
      animation: nativeBootPulse 1.15s cubic-bezier(.2,.8,.2,1) infinite alternate;
    }
    @keyframes nativeBootPulse { from { transform: scale(.94); opacity: .86; } to { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .native-boot-logo { animation: none; } }
  </style>

  <!-- Mobile app/browser metadata -->
  <meta name="description" content="Software Developer Portfolio - Jayant Bhardwaj. Explore projects, skills, and interview preparation resources.">
  <meta name="theme-color" content="#132033">

  <!-- Favicon: canvas-drawn to bypass Chrome's favicon cache entirely -->
  <script>
    (function() {
      var c = document.createElement('canvas');
      c.width = 32; c.height = 32;
      var ctx = c.getContext('2d');
      var g = ctx.createLinearGradient(0, 0, 32, 32);
      g.addColorStop(0, '#6366f1');
      g.addColorStop(1, '#8b5cf6');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(7, 0); ctx.lineTo(25, 0); ctx.quadraticCurveTo(32, 0, 32, 7);
      ctx.lineTo(32, 25); ctx.quadraticCurveTo(32, 32, 25, 32);
      ctx.lineTo(7, 32); ctx.quadraticCurveTo(0, 32, 0, 25);
      ctx.lineTo(0, 7); ctx.quadraticCurveTo(0, 0, 7, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px Arial,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('C', 16, 17);
      var link = document.createElement('link');
      link.rel = 'icon'; link.type = 'image/png';
      link.href = c.toDataURL('image/png');
      document.head.appendChild(link);
    })();
  </script>


  <!-- Bootstrap Icons (single copy) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Local CSS (absolute paths - work on every route) -->
  <link href="/assets/css/font-awesome/css/all.min.css" rel="stylesheet">
  <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/aos.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">

  <!-- Prevent AOS from hiding elements before JS fires (fixes refresh flicker/stuck) -->
  <style>[data-aos] { opacity: 1 !important; transform: translate(0) scale(1) !important; }</style>
  <noscript>
    <style>[data-aos] { opacity: 1 !important; transform: translate(0) scale(1) !important; }</style>
  </noscript>

  <!-- ── Theme: apply BEFORE first paint to prevent flash of wrong theme ── -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('am_theme');
        var dark = saved ? saved === 'dark'
                        : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root><div class="native-boot-screen" aria-label="LearnWithAI is starting"><img class="native-boot-logo" src="/assets/icons/icon-192x192.svg" alt="LearnWithAI"></div></app-root>

  <!-- Scripts (absolute paths - work on every route) -->
  <script src="/assets/scripts/imagesloaded.pkgd.min.js"></script>
  <script src="/assets/scripts/masonry.pkgd.min.js"></script>
  <script src="/assets/scripts/BigPicture.min.js"></script>
  <script src="/assets/scripts/purecounter.min.js"></script>
  <script src="/assets/scripts/bootstrap.bundle.min.js"></script>
  <script src="/assets/scripts/aos.min.js"></script>
  <script>
    if (typeof AOS !== 'undefined') {
      AOS.init({ duration: 900, easing: 'ease-out-cubic', once: false });
    }
  </script>
  <script src="/assets/scripts/main.js"></script>
  <script src="/assets/scripts/smooth-scrollbar.js"></script>
  <script>
    if (typeof window.Scrollbar !== 'undefined') {
      var scrollbarElement = document.querySelector('#my-scrollbar');
      if (scrollbarElement) { window.Scrollbar.init(scrollbarElement); }
    }
  </script>
  <!-- Razorpay Checkout SDK — loaded on every page; tiny impact, required by subscribe page -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>
</html>
