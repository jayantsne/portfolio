<section class="skills-section coder-section" id="skills" appRevealOnScroll>
  <div class="container">

    <!-- HEADER -->
    <div class="skills-header">
      <span class="coder-kicker">Toolbox</span>
      <h2 class="skills-title coder-title marker">My Skills</h2>
      <p class="skills-subtitle">
        Technologies I use to build reliable and scalable software.
      </p>
    </div>

    <!-- GRID (add .horizontal here if needed) -->
    <div class="skills-grid">
      <div
        class="skill-card"
        *ngFor="let skill of skills; let i = index"
        [attr.data-percent]="skill.percent"
        [style.animationDelay]="i * 120 + 'ms'"
        tabindex="0"
        (click)="openModal(skill)"
      >

        <span class="skill-stamp" aria-hidden="true">&lt;/&gt;</span>

        <!-- CIRCLE -->
        <div class="circle">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <!-- UNIQUE gradient per card (IMPORTANT FIX) -->
              <linearGradient [attr.id]="'skillGradient' + i">
                <stop offset="0%" stop-color="#ff4d8d"/>
                <stop offset="100%" stop-color="#ffd54f"/>
              </linearGradient>
            </defs>

            <circle cx="50" cy="50" r="45" class="bg"></circle>
            <circle
              cx="50"
              cy="50"
              r="45"
              class="progress"
              [attr.stroke]="'url(#skillGradient' + i + ')'"
            ></circle>
          </svg>

          <!-- ICON -->
          <i class="bi {{ skill.icon }} skill-icon" aria-hidden="true"></i>

          <!-- % -->
          <span class="circle-value">0%</span>
        </div>

        <!-- NAME -->
        <h6 class="skill-name">{{ skill.name }}</h6>

        <!-- HOVER DESCRIPTION -->
        <p class="skill-desc">
          {{ skill.desc }}
        </p>

      </div>
    </div>

  </div>

  <!-- MODAL (OUTSIDE GRID – IMPORTANT) -->
  <div class="skill-modal" *ngIf="activeSkill">
    <div class="modal-backdrop" (click)="closeModal()"></div>

    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" (click)="closeModal()" aria-label="Close modal">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M18 6L6 18M6 6l12 12"/>
  </svg>
</button>

      <h3 class="modal-title">{{ activeSkill.name }}</h3>
      <p class="modal-desc">{{ activeSkill.desc }}</p>

      <ul class="modal-list">
        <li *ngFor="let item of activeSkill.details">
          {{ item }}
        </li>
      </ul>
    </div>
  </div>

</section>
