<!--
  ════════════════════════════════════════════════════════════
  NAVBAR — Global top navigation (ChatGPT-style)
  ────────────────────────────────────────────────────────────
  Full-width sticky bar, 52px height.
  Left  : Logo + nav links
  Right : Upgrade CTA + user avatar
  ════════════════════════════════════════════════════════════
-->
<header class="navbar" role="banner">

  <!-- ── Left ─────────────────────────────────────────── -->
  <div class="nav-start">

    <!-- Logo -->
    <a routerLink="/"
       class="nav-logo"
       aria-label="Codexa — home">
      <svg class="logo-icon" width="20" height="20" viewBox="0 0 24 24"
           fill="currentColor"
           aria-hidden="true">
        <!-- Sparkle / AI star icon -->
        <path d="M12 2L13.09 8.26L19 6L14.74 10.74L21 12L14.74 13.26L19 18L13.09 15.74L12 22L10.91 15.74L5 18L9.26 13.26L3 12L9.26 10.74L5 6L10.91 8.26L12 2Z"/>
      </svg>
      <span class="logo-text">Codexa</span>
    </a>

    <!-- Primary nav links -->
    <nav class="nav-links" aria-label="Primary navigation">

      <a routerLink="/explore"
         routerLinkActive="nav-link--active"
         class="nav-link">Explore</a>

      <a routerLink="/notes"
         routerLinkActive="nav-link--active"
         class="nav-link">Notes</a>

      <a routerLink="/interview-prep"
         routerLinkActive="nav-link--active"
         class="nav-link">Interview Prep</a>

      <!-- <a routerLink="/playground"
         routerLinkActive="nav-link--active"
         class="nav-link">Playground</a> -->

    </nav>

  </div>

  <!-- ── Right ────────────────────────────────────────── -->
  <div class="nav-end">

    <!-- Hamburger (mobile only) -->
    <button class="nav-hamburger"
            (click)="toggleMobileMenu()"
            [attr.aria-expanded]="isMobileMenuOpen"
            aria-label="Toggle navigation menu">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>

    <!-- Light / dark toggle -->
    <button class="theme-toggle-btn"
            (click)="themeSvc.toggle()"
            [title]="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
            aria-label="Toggle dark mode">
      <!-- Sun: shown when dark, to switch back to light -->
      <svg *ngIf="isDark" width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <!-- Moon: shown in light mode to switch to dark -->
      <svg *ngIf="!isDark" width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    <a routerLink="/subscribe"
       class="upgrade-btn"
       *ngIf="!isLoggedIn"
       aria-label="Upgrade plan">Upgrade</a>

    <!-- Not logged in: Sign in button -->
    <button
      *ngIf="!isLoggedIn"
      class="nav-signin-btn"
      (click)="openLogin()"
      aria-label="Sign in">
      Sign in
    </button>

    <!-- Logged in: avatar + logout -->
    <div class="nav-user-menu" *ngIf="isLoggedIn">
      <button
        class="user-avatar-btn"
        [title]="userEmail"
        aria-label="Account"
        aria-haspopup="true"
        (click)="showUserMenu = !showUserMenu">
        {{ userInitial }}
      </button>

      <!-- Dropdown -->
      <div class="nav-user-dropdown" *ngIf="showUserMenu">
        <div class="nav-user-email">{{ userEmail }}</div>
        <a routerLink="/account" class="nav-user-item" (click)="showUserMenu = false">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Account
        </a>
        <button class="nav-user-item nav-user-item--logout" (click)="logout(); showUserMenu = false">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign out
        </button>
      </div>
    </div>

  </div>

</header>

<!-- ── Mobile nav backdrop ──────────────────────────────── -->
<div class="nav-mobile-backdrop"
     *ngIf="isMobileMenuOpen"
     (click)="closeMobileMenu()"
     aria-hidden="true"></div>

<!-- ── Mobile nav drawer ────────────────────────────────── -->
<nav class="nav-mobile-drawer"
     *ngIf="isMobileMenuOpen"
     aria-label="Mobile navigation">

  <a routerLink="/explore"
     routerLinkActive="nav-link--active"
     class="mobile-nav-link"
     (click)="closeMobileMenu()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    Explore
  </a>

  <a routerLink="/notes"
     routerLinkActive="nav-link--active"
     class="mobile-nav-link"
     (click)="closeMobileMenu()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
    </svg>
    Notes
  </a>

  <a routerLink="/interview-prep"
     routerLinkActive="nav-link--active"
     class="mobile-nav-link"
     (click)="closeMobileMenu()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    Interview Prep
  </a>

  <a routerLink="/playground"
     routerLinkActive="nav-link--active"
     class="mobile-nav-link"
     (click)="closeMobileMenu()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
    </svg>
    Playground
  </a>

  <div class="mobile-nav-divider"></div>

  <!-- Auth section inside mobile drawer -->
  <div *ngIf="!isLoggedIn" class="mobile-nav-auth">
    <button class="mobile-nav-signin" (click)="openLogin(); closeMobileMenu()">Sign in</button>
    <a routerLink="/subscribe" class="mobile-nav-upgrade" (click)="closeMobileMenu()">Upgrade</a>
  </div>

  <div *ngIf="isLoggedIn" class="mobile-nav-user">
    <div class="mobile-nav-user-email">{{ userEmail }}</div>
    <a routerLink="/account" class="mobile-nav-link" (click)="closeMobileMenu()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      Account
    </a>
    <button class="mobile-nav-link mobile-nav-signout" (click)="logout(); closeMobileMenu()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Sign out
    </button>
  </div>

</nav>
