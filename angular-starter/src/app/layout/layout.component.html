<!--
  ════════════════════════════════════════════════════════════
  LAYOUT — App Shell (ChatGPT-style)
  ────────────────────────────────────────────────────────────
  Flex-column:
    app-navbar     — sticky top bar, full-width, 52px
    .content-wrapper — flex-row, fills remaining height
      .panel       — contextual content (~300px), only rendered
                     when the active page registers a template
                     via SidebarContentService
      .main        — primary scroll zone (flex:1)
  ════════════════════════════════════════════════════════════
-->

<div class="layout" [class.layout--scrolled]="isScrolled">

  <!-- ── Sticky top navbar ─────────────────────────────── -->

  <!-- ── Content area ──────────────────────────────────── -->
  <div class="content-wrapper">

    <header class="mobile-shell-header">
      <a class="mobile-brand" routerLink="/explore" aria-label="LearnWithAI home">
        <span class="mobile-brand-mark">L<span class="brand-spark">+</span></span>
        <span class="mobile-brand-copy"><strong>LearnWithAI</strong><small>Learn with clarity</small></span>
      </a>
      <button class="mobile-account" (click)="openAccount()"
              [attr.aria-label]="auth.isLoggedIn ? 'Open account' : 'Sign in to LearnWithAI'">
        <span class="mobile-account-avatar">{{ auth.isLoggedIn ? (auth.currentUser?.username?.[0]?.toUpperCase() || 'A') : 'A' }}</span>
        <span>{{ auth.isLoggedIn ? 'Account' : 'Sign in' }}</span>
      </button>
    </header>

    <nav class="app-rail" aria-label="Primary navigation">
      <a class="app-rail-brand" routerLink="/explore" title="LearnWithAI" aria-label="LearnWithAI home">L</a>
      <a class="app-rail-link" routerLink="/explore" routerLinkActive="app-rail-link--active" title="Explore"><i class="fas fa-compass"></i><small>Explore</small></a>
      <a class="app-rail-link" routerLink="/flow-generator" routerLinkActive="app-rail-link--active" title="Flow"><i class="fas fa-project-diagram"></i><small>Flow</small></a>
      <a class="app-rail-link" routerLink="/notes" routerLinkActive="app-rail-link--active" title="Notes"><i class="far fa-sticky-note"></i><small>Notes</small></a>
      <a class="app-rail-link" routerLink="/interview-prep" routerLinkActive="app-rail-link--active" title="Interview roadmap"><i class="fas fa-route"></i><small>Prep</small></a>
      <a class="app-rail-link" routerLink="/interview-battle" routerLinkActive="app-rail-link--active" title="Interview Battle"><i class="fas fa-microphone-alt"></i><small>Battle</small></a>
      <a class="app-rail-link" *ngIf="auth.isAdmin" routerLink="/admin/interview-prep" routerLinkActive="app-rail-link--active" title="Interview question library"><i class="fas fa-list-alt"></i><small>Admin</small></a>
      <div class="app-rail-spacer"></div>
      <button class="app-rail-action" (click)="theme.toggle()" title="Toggle theme" aria-label="Toggle theme">T</button>
      <button class="app-rail-account" (click)="openAccount()"
              [title]="auth.isLoggedIn ? 'Account' : 'Sign in'"
              [attr.aria-label]="auth.isLoggedIn ? 'Account' : 'Sign in'">{{ auth.isLoggedIn ? (auth.currentUser?.username?.[0]?.toUpperCase() || 'A') : 'A' }}</button>
      <button class="app-rail-action app-rail-logout" *ngIf="auth.isLoggedIn" (click)="logout()" title="Log out" aria-label="Log out">OUT</button>
    </nav>

    <!-- Panel: contextual content registered by the active page -->
    <aside class="panel"
           *ngIf="hasPanel$ | async"
           role="complementary"
           [attr.aria-label]="panelTitle$ | async">

      <!-- Panel header with title -->
      <div class="panel-hd" *ngIf="(panelTitle$ | async) as title">
        <span class="panel-title">{{ title }}</span>
      </div>

      <!-- Page-registered template content -->
      <div class="panel-body">
        <ng-container *ngTemplateOutlet="panelTpl$ | async"></ng-container>
      </div>

    </aside>

    <!-- Main: primary content area -->
    <main class="main"
          #mainRef
          id="main-content"
          role="main"
          tabindex="-1">
      <router-outlet></router-outlet>
    </main>

  </div>
  <!-- /content-wrapper -->

</div>
<!-- /layout -->
