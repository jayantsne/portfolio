<!-- Floating Button -->
<button class="chat-toggle"  (click)="toggleChat()">💬</button>

<!-- Chat Box -->
<div
  class="chat-box"
  [class.open]="isOpen"
  [class.mobile]="isMobile"
  *ngIf="isOpen"
>
  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header-info">
      <div class="chat-avatar">🤖</div>
      <div class="chat-title-group">
        <span class="chat-title">Ask AI about my work</span>
        <span class="chat-status"><span class="status-dot"></span>Online</span>
      </div>
    </div>
    <div class="chat-actions">
      <button
        class="icon-btn select-btn"
        [class.active]="selectionMode"
        title="Select messages to save"
        *ngIf="authSvc.currentUser && messages.length > 1"
        (click)="toggleSelectMode()">☑</button>
      <button
        class="icon-btn save-notes-btn"
        title="Save whole conversation as notes"
        *ngIf="authSvc.currentUser && hasConversation && !selectionMode"
        (click)="openSaveModal()">📓</button>
      <button class="icon-btn close-btn" title="Close" (click)="toggleChat()">✕</button>
    </div>
  </div>

  <!-- Saved toast -->
  <div class="save-toast" *ngIf="savedToast">✅ Conversation saved to notes!</div>

  <!-- Body -->
  <div class="chat-body" #chatBody>
    <div
      *ngFor="let msg of messages; let i = index"
      class="message-wrap"
      [class.selecting]="selectionMode"
    >
      <!-- Selection checkbox -->
      <div class="msg-checkbox" *ngIf="selectionMode && i > 0" (click)="toggleMsgSelection(i)">
        <span class="checkbox-icon">{{ selectedIndices.has(i) ? '✅' : '⬜' }}</span>
      </div>

      <div
        class="message"
        [ngClass]="msg.role"
        [class.selected]="selectedIndices.has(i)"
      >
        {{ msg.text }}

        <!-- Per-message save icon (shown on hover when logged in, not in select mode, not first welcome) -->
        <button
          class="msg-save-btn"
          title="Save this message as a note"
          *ngIf="authSvc.currentUser && i > 0 && !selectionMode"
          (click)="saveMessageAsNote(i)">
          📓
        </button>
      </div>
    </div>

    <!-- Save Selection bar -->
    <div class="selection-bar" *ngIf="selectionMode">
      <span class="selection-count">{{ selectedIndices.size }} message{{ selectedIndices.size !== 1 ? 's' : '' }} selected</span>
      <button class="btn-save-sel" [disabled]="selectedIndices.size === 0" (click)="saveSelection()">
        💾 Save Selection
      </button>
      <button class="btn-cancel-sel" (click)="toggleSelectMode()">Cancel</button>
    </div>

    <!-- Typing dots -->
    <div class="typing" *ngIf="typing">
      <span></span><span></span><span></span>
    </div>

    <!-- Suggestions -->
    <div class="suggestions" *ngIf="showSuggestions">
      <button (click)="quickAsk('Tell me about your skills')">Skills</button>
      <button (click)="quickAsk('What projects have you worked on?')">Projects</button>
      <button (click)="quickAsk('Describe your experience')">Experience</button>
    </div>
  </div>

  <!-- Footer -->
  <div class="chat-footer">
    <input
      [(ngModel)]="input"
      placeholder="Ask about my work…"
      (keydown.enter)="send()"
    />
    <button (click)="send()">Send ↑</button>
  </div>
</div>

<!-- Save as Notes modal -->
<app-save-notes-modal
  [isVisible]="showSaveModal"
  [topic]="saveNoteTopic"
  [content]="saveNoteContent"
  (closed)="showSaveModal = false"
  (saved)="onNoteSaved()">
</app-save-notes-modal>
