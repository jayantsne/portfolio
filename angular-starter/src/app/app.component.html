<!-- Splash screen - Controlled by app.config.ts -->
<app-splash-screen *ngIf="showSplash" [minDurationMs]="splashDuration" (done)="onSplashDone()"></app-splash-screen>
<app-global-loader></app-global-loader>
<app-admin-android-download-button></app-admin-android-download-button>

<!-- Global header removed: NavbarComponent inside LayoutComponent replaces it.
     NavbarComponent is scoped to the right panel (not full-width). -->
<router-outlet></router-outlet>
<!-- <app-ai-chat></app-ai-chat> -->

<!-- Footer is embedded inside home component when on home page;
     show it here for all other routes -->
<app-footer *ngIf="!isHomePage"></app-footer>

<!-- Global auth modal — lives here (AppModule scope) and is opened via
     AuthTriggerService.login$ from any component in the app. -->
<app-auth-modal #globalAuthModal (loggedIn)="onGlobalLoggedIn()"></app-auth-modal>
