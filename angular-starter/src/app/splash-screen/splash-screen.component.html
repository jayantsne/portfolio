<div class="splash" [class.leaving]="leaving" (click)="skip()" role="dialog" aria-label="Loading">

  <!-- ░░ Aurora blobs ░░ -->
  <div class="aurora" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <!-- ░░ Dot particles ░░ -->
  <div class="particles" aria-hidden="true">
    <span *ngFor="let p of particles" class="particle"
      [style.left.%]="p.x"
      [style.top.%]="p.y"
      [style.animation-delay.s]="p.delay"
      [style.animation-duration.s]="p.dur"
      [style.width.px]="p.size"
      [style.height.px]="p.size">
    </span>
  </div>

  <!-- ░░ Pulsing rings ░░ -->
  <div class="rings" aria-hidden="true">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
  </div>

  <!-- ░░ Main stage ░░ -->
  <div class="stage">

    <!-- Orbiting icons -->
    <div class="icon-orbit" aria-hidden="true">
      <span class="oi oi-1">⚡</span>
      <span class="oi oi-2">🧠</span>
      <span class="oi oi-3">🚀</span>
      <span class="oi oi-4">✨</span>
    </div>

    <!-- Logo -->
    <div class="logo-wrap">
      <h1 class="logo">
        <span class="logo-ai">AI</span><span class="logo-gap"> </span><span class="logo-learn">Learn</span>
      </h1>
      <div class="logo-underline" aria-hidden="true"></div>
    </div>

    <!-- Tagline -->
    <p class="tagline" aria-live="polite">
      Master&nbsp;<span class="word-cycle">
        <span class="wc wc1">Programming.</span>
        <span class="wc wc2">Interviews.</span>
        <span class="wc wc3">AI Skills.</span>
      </span>
    </p>

    <!-- Pills -->
    <div class="pills" aria-hidden="true">
      <span class="pill p1">500+ Questions</span>
      <span class="pill p2">⚡ AI Powered</span>
      <span class="pill p3">🎮 Games</span>
    </div>

    <!-- Progress -->
    <div class="pbar-wrap" role="progressbar" aria-label="Loading">
      <div class="pbar-track">
        <div class="pbar-fill"></div>
      </div>
    </div>

    <!-- Skip -->
    <div class="skip-hint">tap anywhere to skip</div>

  </div>

  <!-- Corner glints -->
  <div class="glint glint-tl" aria-hidden="true"></div>
  <div class="glint glint-br" aria-hidden="true"></div>

</div>
