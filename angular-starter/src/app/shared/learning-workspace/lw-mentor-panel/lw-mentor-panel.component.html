<!-- LW Mentor Panel — right column AI assistant -->
<div class="lwm-panel">

  <!-- ── Tab strip ── -->
  <div class="lwm-tabs" role="tablist">
    <button class="lwm-tab" [class.lwm-tab--active]="activeTab === 'mentor'"
            role="tab" (click)="setTab('mentor')">
      🤖 AI Mentor
    </button>
    <button class="lwm-tab" [class.lwm-tab--active]="activeTab === 'notes'"
            role="tab" (click)="setTab('notes')">
      📝 My Notes
      <span *ngIf="localNotes.length" class="lwm-tab-badge">{{ localNotes.length }}</span>
    </button>
  </div>

  <!-- ════════════════════════
       MENTOR TAB
       Only quick actions + ask input.
       The actual conversation thread lives in the center lesson panel.
  ════════════════════════ -->
  <div class="lwm-body" *ngIf="activeTab === 'mentor'">

    <!-- Context hint -->
    <p class="lwm-hint" *ngIf="topicTitle">
      Studying: <strong>{{ topicTitle }}</strong>
    </p>

    <!-- Quick-action chips -->
    <div class="lwm-chips-title">Quick Actions</div>
    <div class="lwm-chips">
      <button *ngFor="let c of chips; trackBy: trackByIndex"
              class="lwm-chip"
              [disabled]="loading"
              (click)="onChip(c.prompt)">
        <span>{{ c.icon }}</span> {{ c.label }}
      </button>
    </div>

    <!-- Loading indicator (shows while AI is responding in the center panel) -->
    <div class="lwm-generating" *ngIf="loading">
      <span class="lwm-gen-dot"></span>
      <span class="lwm-gen-dot"></span>
      <span class="lwm-gen-dot"></span>
      <span class="lwm-gen-label">Generating response…</span>
    </div>

    <!-- Freeform ask input -->
    <div class="lwm-ask">
      <input class="lwm-ask-input"
             [(ngModel)]="askText"
             (keyup.enter)="onSend()"
             placeholder="Ask anything about this topic…"
             [disabled]="loading" />
      <button class="lwm-ask-send"
              [disabled]="!askText.trim() || loading"
              (click)="onSend()">
        ➤
      </button>
    </div>

  </div><!-- /mentor tab -->

  <!-- ════════════════════════
       NOTES TAB
       Fully self-contained — persists to localStorage keyed by lessonId.
  ════════════════════════ -->
  <div class="lwm-body lwm-body--notes" *ngIf="activeTab === 'notes'">

    <!-- Editor -->
    <div class="lwm-note-editor">
      <textarea class="lwm-note-ta"
                [(ngModel)]="noteText"
                rows="4"
                placeholder="Write a note for {{ topicTitle || 'this lesson' }}…"></textarea>
      <button class="lwm-btn lwm-btn--primary lwm-btn--full"
              [disabled]="!noteText.trim()"
              (click)="addNoteLocal()">
        💾 Save Note
      </button>
    </div>

    <!-- Notes count -->
    <div *ngIf="localNotes.length" class="lwm-notes-count">
      <span>{{ localNotes.length }} note{{ localNotes.length !== 1 ? 's' : '' }} for this lesson</span>
      <button class="lwm-btn lwm-btn--ghost lwm-btn--sm"
              (click)="syncNotes.emit()"
              title="Sync to My Notes page">☁️ Sync</button>
    </div>

    <!-- Saved notes list -->
    <div *ngIf="localNotes.length" class="lwm-notes-list">
      <div *ngFor="let n of localNotes; let i = index; trackBy: trackById"
           class="lwm-note">
        <!-- View mode -->
        <ng-container *ngIf="editingIndex !== i">
          <div class="lwm-note-hd">
            <span class="lwm-note-date">{{ n.createdAt | date:'MMM d, h:mm a' }}</span>
            <div class="lwm-note-actions">
              <button class="lwm-note-edit" (click)="startEdit(i)" title="Edit note">✏️</button>
              <button class="lwm-note-del"  (click)="deleteNoteLocal(i)" title="Delete note">✕</button>
            </div>
          </div>
          <p class="lwm-note-text">{{ n.content }}</p>
        </ng-container>

        <!-- Edit mode -->
        <ng-container *ngIf="editingIndex === i">
          <textarea class="lwm-note-ta lwm-note-ta--edit"
                    [(ngModel)]="editText"
                    rows="3"></textarea>
          <div class="lwm-edit-actions">
            <button class="lwm-btn lwm-btn--primary lwm-btn--sm"
                    [disabled]="!editText.trim()"
                    (click)="saveEdit(i)">✓ Save</button>
            <button class="lwm-btn lwm-btn--ghost lwm-btn--sm"
                    (click)="cancelEdit()">Cancel</button>
          </div>
        </ng-container>
      </div>
    </div>

    <!-- Empty state -->
    <div *ngIf="!localNotes.length" class="lwm-notes-empty">
      <span class="lwm-notes-empty-icon">📝</span>
      <p>No notes yet for this lesson.</p>
      <p class="lwm-notes-empty-sub">Use the editor above to add one.</p>
    </div>

  </div><!-- /notes tab -->

</div>
