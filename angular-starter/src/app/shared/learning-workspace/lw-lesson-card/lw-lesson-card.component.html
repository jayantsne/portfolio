<!-- LW Lesson Card — one structured lesson section -->
<div class="lwc-card"
     [class.lwc-card--code]="isCode"
     [class.lwc-card--practice]="isPractice"
     [class.lwc-card--exam]="isExamTip">

  <!-- Card header -->
  <div class="lwc-hd">
    <span class="lwc-hd-icon">{{ meta.icon }}</span>
    <span class="lwc-hd-title">{{ meta.title }}</span>
    <!-- Run in Playground button — only on code sections when playground is available -->
    <button *ngIf="isCode && showPlayground"
            class="lwc-pg-btn"
            (click)="onRunInPlayground()"
            title="Open this code in AI Code Lab">
      ⚡ Run in Playground
    </button>
  </div>

  <!-- Body — parent passes SafeHtml rendered from markdown (MarkdownPipe) -->
  <div class="lwc-body md-content" appTryNow [innerHTML]="htmlContent"></div>

</div>
